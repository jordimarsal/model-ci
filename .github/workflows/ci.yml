name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run offline test suite (no network, no GPU)
        run: uv run pytest -q
      - name: Type-check (strict)
        run: uv run mypy
